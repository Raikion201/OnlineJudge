version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: user-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: user_service_db
      MYSQL_USER: useruser
      MYSQL_PASSWORD: userpass123
    ports:
      - "3308:3306"
    volumes:
      - user-mysql-data:/var/lib/mysql
    networks:
      - user-service-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service-app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: useruser
      DB_PASSWORD: userpass123
      SERVER_PORT: 8080
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - user-service-network

volumes:
  user-mysql-data:

networks:
  user-service-network:
    driver: bridge
